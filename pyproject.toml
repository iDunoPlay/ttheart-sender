[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttheart-sender"
# Single source of truth: ttheart_sender/version.py
dynamic = ["version"]
description = "Screenshot-driven Windows/LDPlayer click automation with declarative YAML flows"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mss>=9.0",
    "PyYAML>=6.0",
    "pyautogui>=0.9.54",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
build = ["pyinstaller>=6.0", "pillow>=10.0"]  # .exe packaging + icon generation

[project.scripts]
ttheart = "ttheart_sender.cli:main"

[project.gui-scripts]
ttheart-tray = "ttheart_sender.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ttheart_sender.version.__version__"}

[tool.setuptools.packages.find]
include = ["ttheart_sender*"]

[tool.setuptools.package-data]
ttheart_sender = ["tray/assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
