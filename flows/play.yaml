name: play_round
description: Start a round from the main screen, play the board, clear the results

# Assumes the main screen is already up (play_button visible) -- `launch.yaml`
# gets you there. Call it from another flow with:
#
#   - run_flow: play
#
# and stop it at any time with the stop key (F12 by default).
vars:
  level_cap_found: false

  # Stuck/crash watchdog. Off, per the house rule for new detection rules --
  # flip this one line to true to arm it, and back to false to revert. When on,
  # a screen that shows none of the landmarks below *and* has not changed for
  # thirty seconds is treated as a wedged game and gets the emulator
  # restarted.
  # Stillness alone is never enough: a healthy menu measures pixel-identical.
  stuck_check: false

  # The two experiments the panel ticks, and their off values. Both are wired
  # into `play_tsum`'s options below, so these lines are the revert as well as
  # the default: set them here and the panel's tick boxes are the same switch
  # from the other end.
  #
  # `fit_effort` -- how many restarts the per-frame colour fit gets. 3 is the
  # steadiest measured and, since the thirteenth round, the default: 4,306
  # drags played at it gave up nothing against the 726-drag level 1 baseline.
  # Set this to 1 to revert. See the option below for what each buys.
  fit_effort: 3
  # `verify_clears` -- count what actually left the board after each drag.
  # Cheap: it reads the frame `--verify` already grabbed, so there is no
  # extra capture -- which is why it is worth leaving ON permanently rather
  # than saving for a measuring round. ON since the fifteenth round: it is
  # the ruler, and every rule below is unpriceable without it.
  verify_clears: true
  # `verify_extend` -- on a `verify_reach` check, rebuild the chain from what
  # the game marked instead of only trimming the proposal to it.
  #
  # ON as of the fifteenth round, and the reason is a measurement rather than
  # patience. `scripts/identity_probe.py` scored the bot's own `kind` as a
  # classifier against the game's marks for the first time: it links 38.2% of
  # the game's confirmed partners and 23.6% of non-partners anyway. Identity
  # is a coin flip, which is what 28.8% refused members and 25% of drags
  # falling under min_chain have always been. The same probe closed the cheap
  # way out -- no descriptor computable from these crops beats plain median
  # Lab on held-out sessions (0.561 AUC; shape 0.510), because the median tsum
  # shows 0.42 of its own radius and the character is buried under the pile.
  #
  # So the bot cannot learn identity from this capture, and the game is the
  # only reliable source of it. This rule is the one place that answer is
  # already bought and was being half-spent.
  #
  # PROVEN ON A PLAYED ROUND, fifteenth: ten rounds, 863 drags, with
  # `verify_clears` measuring. The worry this shipped with was that a rebuild
  # believes the game about IDENTITY as well as about refusal, and that half
  # had never been priced. It is priced: of the members the rebuild added,
  # **22 of 22 left the board** -- they clear better than the chain they join
  # (87.5%). Over the batch it rebuilt 33 chains and added 95 members on 130
  # checks, for no reading cost at all: `verify_reach` had already bought the
  # answer. Leave it on.
  #
  # OFF SINCE THE EIGHTEENTH ROUND, and not because it was wrong. It rebuilds
  # a chain from a reading that only a check produces, and `verify_reach` is
  # now 0, so there is no reading to rebuild from -- left true it would print
  # "it will not fire" once a round and do nothing. The rule itself is intact
  # and still beats the trim; what stopped paying is the check underneath it.
  # Turn `verify_reach` back to 260 and set this true to restore both.
  verify_extend: false
  # `verify_no_trim` -- spend the check on the REBUILD only, never on the trim.
  #
  # The trim was built on "a refused member costs the whole drag". The
  # fifteenth round measured that and it is false; the sixteenth found the
  # shape: refusals are a SUFFIX -- 78% of refusing drags refuse everything
  # after the first bad member, which clears 28.6% against 84.8% before it.
  # The chain dies where it first goes wrong. So the members the trim removes
  # were already worth nothing, and a chain the trim ABANDONS outright was
  # going to clear its opening members for free.
  #
  # With this on, a check that cannot lengthen the chain hands back the
  # proposal untouched, and nothing is ever abandoned. The rebuild still runs
  # -- that half is the part the fifteenth round proved (22 of 22 added
  # members cleared).
  #
  # OFF, and it should stay off until a round says otherwise: it is derived
  # from 36 drags and from a cost model this project has now had wrong twice.
  # WHAT TO WATCH LIVE: `cleared N (M%)` should rise, and the round should
  # stop reporting `rejected N chain(s) outright`. If clears fall, the trim
  # was doing something after all -- revert by setting this back to false.
  verify_no_trim: false

  # `recolour` -- DECIDE IDENTITY FROM THE FACES, NOT FROM THE PIXELS.
  #
  # `kind` today is a pixel-level k-means cluster. It is a coin flip about
  # identity: it links 37% of the partners the game confirms and 26% of the
  # tsums it does not. One character lit differently across the board lands in
  # two clusters, and `adjacency` will not link across a kind difference at any
  # distance -- so those partners are unreachable, which is the recall gap.
  #
  # `recolour` samples each FACE once, in the middle where lighting is evenest,
  # and merges groups closer than this many Lab units. 0 = off.
  #
  # THE EVIDENCE DISAGREES WITH ITSELF, and that is why it is off:
  #   * scored symmetrically against the game's marks (agreement that partners
  #     share an id, AND split that non-partners do not), it is FLAT -- 55.1%
  #     balanced for k-means, 55.6% at its best, over 685 samples. No threshold
  #     adds information; they only slide along the same trade.
  #   * scored on the chains it builds, it gains a lot -- but that score prices
  #     an unknown tail member as positive, so it rewards merging without
  #     bound, and following that gradient is what produced "chains of 27 and
  #     31 tsums on real boards" the last time this was tried.
  #
  # So only a played round decides. 35 is the value to try: it keeps mean chain
  # length near 6, inside the range the clear model was fitted on, and
  # `max_chain: 12` caps the damage either way.
  #
  # PLAYED AND REJECTED, twentieth round. 5 rounds at 35 against 15 rounds at
  # 0, everything else equal:
  #     clears/second   3.74 -> 3.50  (-6.5%)
  #     cleared         68.5% -> 68.6% (unchanged)
  #     mean chain len  4.74 -> 4.49,  6+ chains 23.8% -> 19.4%
  # Which is exactly what the symmetric offline score said: flat on identity,
  # and the chain score that liked it was pricing unknown members as positive.
  # Stays at 0; set it to 35 only to reproduce the result.
  # COSTS: about 18ms a frame against a ~100ms decision.
  recolour: 0

  # `bowl_reject` -- drop detections whose face colour sits within this many
  # Lab of the board's own colour, on the theory that they landed on the bowl
  # rather than on a tsum. 0 = off.
  #
  # ON AT 40 SINCE THE THIRTEENTH ROUND AND NEVER A/B'd LIVE, which its own
  # help text asked for: the offline case is f1 0.762 -> 0.785, and f1 cannot
  # say whether the drags it loses were ones the game would have cleared.
  #
  # Measured in the twentieth round, split by condition, against the tsums the
  # game confirmed (`scripts/detect_conditions.py`):
  #     normal : keeps 69.8% of confirmed tsums at 40, 70.5% at 0
  #              finds 44.4 per board at 40, 47.0 at 0
  #     FEVER  : keeps 66.1% either way; finds 32.6 at 40, 33.8 at 0
  # So it throws away about 2.6 detections a board in normal play and buys no
  # recall for them. Whether those were phantoms or tsums is exactly what this
  # corpus cannot say -- hence the round.
  #
  # PLAYED AND KEPT AT 40, twenty-first round. 10 rounds at 0 against 15 at
  # 40, everything else equal:
  #     detections/board   38.0 -> 40.7   (it does find more)
  #     cleared            68.5% -> 73.2% (and they are REAL tsums)
  #     mean chain length  4.74 -> 4.47   (but chains got SHORTER)
  #     seconds per drag   0.869 -> 0.969
  #     clears per second  3.74 -> 3.38   (-9.6%)
  #
  # So the answer its help text asked for is: the detections it drops are not
  # phantoms -- dropping them RAISES the clear rate by 4.7 points, which only
  # real tsums can do. They cost more than they are worth anyway, because an
  # extra real tsum sitting between two others trips the `block` test and
  # breaks a link. More of the board, fewer chains.
  #
  # That is worth remembering before adding detections anywhere else: on a
  # pile this dense, recall and chain length pull against each other.
  bowl_reject: 40
  # `verify_reach` -- the px reach past which a chain is checked before being
  # dragged. 260 has been the shipped value since the tenth round; 0 turns
  # every check OFF, and with it the rebuild.
  #
  # A VARIABLE AS OF THE SEVENTEENTH ROUND, because it is now the thing most
  # worth A/B-ing. Re-swept on 404 drags under the `prefix` model -- the
  # stroke dies at its first refusal -- NOT checking beat every way of
  # checking: 12.51 clears/s against 10.87 for today's trim, 11.29 for the
  # rebuild and 10.50 for rebuild-without-trim. It is not a scoring-curve
  # artefact either: "never" and "no trim" have the same length profile
  # (mean 4.87 vs 4.95, both 25.5% of chains at 6+).
  #
  # That reverses nothing that was measured -- the rebuild really does beat
  # the trim, which is all the fifteenth round claimed -- but five rounds
  # compared trim against something, and none compared checking against not
  # checking under a model that was not broken.
  #
  # SET THIS TO 0 AND PLAY A ROUND. That is the experiment now.
  verify_reach: 0

steps:
  # Clear anything left over from a previous round (the score tally, the High
  # Score popup, a login bonus) before looking for Play. Without this the flow
  # only works from a clean main screen, which is exactly the state it is NOT
  # in when it loops back around after playing.
  - repeat:
      times: 6
      stop_on_failure: true
      delay: {min: 0.4, max: 0.7}
      steps:
        - find_click:
            template: announcement_close_button
            timeout: 3
    optional: true

  # Main screen -> the pre-match screen with the equipped tsum and Start.
  - find_click:
      template: play_button
      timeout: 15
      
  - wait_for:
      template: combo_items
      timeout: 15

  - find_click:
      template: start_button
      timeout: 15

  # Nothing is dragged until the in-play UI is actually up. play_tsum has no
  # countdown of its own, so this wait_for IS the countdown -- and it waits on
  # the real thing rather than guessing how long the 3-2-1 takes.
  - wait_for:
      template: gameplay_footer
      timeout: 20

  - wait_for:
      template: go
      timeout: 4

  # The round itself. It ends when the results screen appears; `duration` is
  # only the backstop for a round where that template never matches, so keep it
  # comfortably longer than a real round (60s, plus whatever FEVER adds).
  #
  # Every knob the `play` command has is available under `options:` -- e.g.
  # {min_chain: 4, per_step: 0.006, base_only: true}. Unknown names are
  # rejected when the step runs rather than silently ignored.
  - play_tsum:
      duration: 300
      until_found: [timeup, tsum_score, last_bonus, scoreboard]
      require_played: 1
      options:
        min_chain: 3
        max_chain: 12
        # HOW FAR APART two tsums can sit and still be joined, in pixels.
        # A tsum is about 46px across, so 105 is roughly "touching, or one
        # small gap apart".
        #   raise it -> the bot reaches further and finds longer chains, but
        #               they are longer on paper only: the game refuses the
        #               far ones, so the drag clears less and stalls more.
        #   lower it -> only near-touching tsums join. Safer, shorter chains.
        # 105 is the measured sweet spot. 150 was tried on a real round and
        # was clearly worse.
        link_px: 105

        # WHETHER SOMETHING IS IN THE WAY. If a different tsum sits on the
        # line between the two you want to join, the game will not join them,
        # so the bot drops that link. This number is how close that other
        # tsum has to be to the line to count as blocking, measured in tsum
        # radii -- 1.25 means "within about one and a quarter tsum widths".
        #   raise it -> fussier. Rejects more links, including some good ones.
        #   lower it -> the bot draws lines straight through other tsums and
        #               the game ignores the drag.
        # It was 0.75 and that was too low: 0.75 radii is ~19px while a tsum
        # is ~25px, so a tsum lying bodily across the line did not count as
        # being in the way. 1.25 stopped those crossings.
        block: 1.25

        # ------------------------------------------------------------------
        # SIX OPT-IN RULES: `bowl_reject`, `mode`, `radius_lock`,
        # `fever_min_tsums`, `palette` and `verify_reach` -- the last two are
        # further down, after the four that came first.
        # TO GO BACK TO NORMAL, DELETE THE LINE. Nothing
        # else has to change and nothing has to be rebuilt -- the code defaults
        # are still the old behaviour, so removing a line is the whole revert.
        #
        # They are independent, so turn them off ONE AT A TIME if a round goes
        # badly: they change different parts of the pipeline and switching
        # several back at once tells you nothing about which one was at fault.
        #
        # `bowl_reject` -- THROW AWAY DETECTIONS THAT LANDED ON THE BOWL.
        # About a third of what detection reports is not a tsum at all but a
        # patch of the water between them, and a chain member that is water is
        # a stop the cursor walks to and the game does not clear. A detection
        # sitting on the bowl carries the bowl's colour, so this drops anything
        # whose face colour is closer than N (in Lab) to the board's own.
        # Scored over the ten labelled boards:
        #     off  precision 0.675  recall 0.874  f1 0.762
        #     40   precision 0.734  recall 0.844  f1 0.785   <- THIS SETTING
        #     60   precision 0.773  recall 0.810  f1 0.791
        #     80   precision 0.813  recall 0.724  f1 0.766
        #   raise it -> fewer phantoms, but real tsums start going with them,
        #               and a tsum thrown away here splits a run of six into
        #               a three and a two.
        #   lower it -> back towards keeping everything. 0 is off.
        # 40 rather than 60 BECAUSE A PLAYED ROUND SAID SO. Offline f1 puts 60
        # a fraction ahead (0.791 vs 0.785), which is inside the noise `eval`
        # itself flags over ten boards, and live it was clearly the worse of
        # the two -- 60 takes real tsums out of the middle of chains. Where the
        # two disagree, the round wins.
        bowl_reject: "${bowl_reject}"

        # `mode: blob` -- DECIDE LINKS BY THE PICTURE, NOT BY DISTANCE.
        # The default rule ("touch") calls two tsums linked when their centres
        # are within `link_px` and nothing sits on the line between them. That
        # is an approximation of the real question, which is whether there is
        # a continuous run of that character joining them; sprites are not
        # circles, so two tsums can overlap at the ears with a gap between
        # their centres, and a third tsum lying between two others makes a real
        # gap look like contact. `blob` tests the mask directly instead.
        # Replayed through the 97 links marked by hand, on identical
        # detections (re-runnable: `tsum score --dir scratchpad`):
        #     touch, link_px 105    76.3% of those links accepted, 246 edges
        #     touch, any distance   84.5% -- the ceiling for the distance rule
        #     blob                  86.6% accepted, 291 edges
        # So it accepts more of the links a human drew while inventing fewer
        # of its own, which is the pair of numbers that matters -- acceptance
        # on its own always improves for a rule that links more freely.
        # `link_px`, `link` and `block` above are IGNORED in this mode.
        # THE COST IS SPEED: ~60ms a frame against ~1.3ms, which roughly
        # doubles the time between reading the board and starting the drag.
        # WHAT TO WATCH LIVE: the `think` figure in the play log, and whether
        # the board has moved on by the time the drag lands. If chains are
        # good but drags miss a settling board, this is the line to remove.
        #mode: blob

        # `radius_lock` -- MEASURE THE TSUM SIZE ONCE, THEN STOP MEASURING.
        # This is the FEVER fix, and it is not really about FEVER.
        # The size of a tsum cannot change during a round, but the estimator
        # re-runs whenever the colour fit is thrown away -- and it re-ran on
        # the FEVER transition, which is the dimmest, most animated moment of
        # the round and exactly where it fails. Measured over 151 captured
        # frames of one round, the per-frame estimate ranges 8px to 38px on a
        # board whose faces are ~26px, and 55% of frames read under 18px.
        #
        # WHY THAT LOOKED LIKE "THE BOT DOES NOTHING IN FEVER": a radius half
        # the truth reads the board at half scale, which roughly DOUBLES the
        # detection count -- and a doubled count is still inside the 20..110
        # sanity range, so the frame is accepted. Phantom chains get found and
        # dragged, nothing clears, and because chains WERE found the "nothing
        # playable -> tap the fan" recovery never runs either. No error, no
        # skip in the log, ten seconds of FEVER spent busy and useless.
        #
        # This measures over the first N frames that look like a board and
        # then holds that number for the round. It takes the LARGEST of the
        # samples, not the middle one: the estimator only ever collapses, it
        # never over-reads, so the biggest sample is the most honest one.
        #   raise it -> a longer warm-up, more samples, slower to settle.
        #   lower it -> locks sooner off fewer frames. 3 is the practical floor.
        #   0 = off, back to re-measuring on every refit.
        # WHAT TO WATCH LIVE: the log prints `radius locked at NNpx` once per
        # round. If that number is under ~20 the warm-up caught a bad patch --
        # raise this, and the round after should read higher.
        radius_lock: 6

        # `fever_min_tsums` -- LET FEVER BE READ ON FEWER TSUMS.
        # `--min-tsums` (20) is not a quality bar, it is a "this is not a board"
        # test: the Home screen scores 200+ fake tsums off portraits, the
        # results screen scores a handful, and dragging across either would
        # swipe live buttons. But FEVER fades and overlays the board, so a
        # perfectly playable in-play frame reads ~20 detections where normal
        # play reads ~50 -- sitting right on the floor, half of them thrown
        # away for looking too empty.
        # Safe to lower ONLY during FEVER, because the floor's real job is
        # already done there by the FEVER template: the game does not draw a
        # FEVER meter over a menu, so the frame is known to be a board before
        # this number is consulted.
        #   raise it -> closer to the strict floor; more fever frames skipped.
        #   lower it -> reads dimmer, sparser boards. Too low and a fade to
        #               black at the start of FEVER becomes a "board".
        #   0 = off, use --min-tsums during FEVER as well.
        # WHAT TO WATCH LIVE: chains actually being dragged between the FEVER
        # and NORMAL lines in the log, instead of a run of `skip` lines.
        fever_min_tsums: 12

        # `fit_effort` -- READ THE SAME BOARD THE SAME WAY TWICE.
        # Colour, detection and the chain all rest on one k-means fit, and
        # that fit is a coin flip more often than anyone had measured.
        #
        # THE PROBLEM IT ATTACKS. `detect` clusters the crop's colours with
        # k-means, which starts from seeded random centres. Re-fitting ONE
        # collected frame at three seeds -- same board, same `k`, same locked
        # radius, nothing else changed -- the two reads agree on only 73% of
        # the tsums they find, and the count swings by a mean of 9 tsums
        # between them. A quarter of the board is decided by the seed. Every
        # number downstream is built on whichever roll came up: which tsums
        # exist, what colour they are, which chain is best.
        #
        # WHAT IT COSTS AND BUYS, over 60 collected boards:
        #     level  two reads agree  count spread  per fit
        #       1          73.1%        9.1 tsums     51ms
        #       2          83.3%        6.2 tsums    138ms
        #       3          91.4%        3.0 tsums    349ms   <- today
        # Sampling more of the board does not help -- 160k pixels instead of
        # 40k reads 82.3%, no better than level 2 at four times the price. It
        # is the number of restarts that matters.
        #
        # WHY THE COST IS SMALL. The loop caches its centres and only fits
        # when there is nothing to reuse: the first frame, a fever transition,
        # a shuffle, a recalibration. Measured in this log, about five fits in
        # a round -- so level 3 costs ~1.5s of a round that runs for minutes,
        # and it spends it exactly on the frames that are hardest to read.
        #
        # WHY IT IS NOW THE DEFAULT. It used to be off because stability is
        # not correctness -- a steadier fit reads the same board the same way
        # twice, and nothing offline says the reading it settles on is the
        # better one. The thirteenth round is the played round that asked for:
        # 321 sessions and 4,306 drags at level 3, against the 726-drag level
        # 1 baseline. Re-measured on the NEW corpus at k 12, the stability
        # figure replicated almost exactly -- 74% at level 1 against 93% at
        # level 3 -- and nothing else moved: colour lift 1.47x -> 1.51x,
        # detections per board 42 either way, over-splits zero either way,
        # refusals 29% -> 30%, `balanced` identical to two decimal places.
        # A read that is twice as steady, gives up nothing, and costs ~1.5s.
        #
        # WHAT WOULD FALSIFY IT: `found` drifting off 42, an over-split board
        # appearing, or a level 1 round out-dragging a level 3 one.
        #
        # HOW TO TURN IT OFF: set `fit_effort: 1` in this flow's `vars:` at
        # the top. That is the only switch there is -- the panel box was
        # removed when this stopped being an experiment, and the tray no
        # longer sends the variable at all. It could not be left there: the
        # tray's overrides are applied OVER a flow's own `vars:`, so a panel
        # still sending `fit_effort` would silently overwrite this line on
        # every run started from the panel, and the revert above would appear
        # to do nothing.
        fit_effort: "${fit_effort}"

        # `palette` -- READ THE BOARD THROUGH COLOURS LEARNED FROM PAST ROUNDS.
        # This is the one line that turns collected data into played rounds,
        # and like the others above it is off until you add it.
        #
        # Normally the colours are re-derived by k-means on every frame, so a
        # cluster id means nothing outside the frame it was fitted on -- the
        # code says as much: "colour-cluster id; stable within one frame only".
        # Every time the fit is thrown away (FEVER starting, FEVER ending, a
        # shuffle, a recalibration) the board is re-read through whatever that
        # one frame happened to show, which on the FEVER transition is the
        # dimmest and most animated frame of the round.
        #
        # `tsum learn` fits ONE palette over every frame you have collected and
        # scores it against the game's own marks. Point this at the file it
        # writes and an id means the same character on every frame of every
        # round instead.
        #
        # THE ORDER IS FIXED, and each step refuses to skip ahead:
        #   1. dataset.enabled: true in config.yaml (or tick it in the tray)
        #   2. play some rounds -- more than one SESSION, or there is nothing
        #      to hold out and nothing can be proved
        #   3. python -m ttheart_sender.game.tsum dataset   -- are the labels real?
        #   4. python -m ttheart_sender.game.tsum learn     -- fit, and score against them
        #   5. only if step 4 says BETTER, add the line below
        #
        # IT SAID NO THE FIRST TIME, on 303 samples over 21 sessions: no k from
        # 6 to 96 beat the per-frame fit, best +0.1 points, which is noise. The
        # reason is measured in docs/DATASET-FINDINGS.md and it is not a lack
        # of data -- the same character's face colours spread 45.6 Lab WITHIN
        # ONE FRAME, so there is no stable colour for a palette to learn. More
        # rounds of the same collection will not change that answer. Left here
        # because the check is worth re-running if detection or the capture
        # geometry changes, and because it is the harness the next attempt gets
        # measured in.
        # `learn` prints NO BETTER or COLLAPSED instead of a path when the
        # palette is not worth having, and there is no reason to overrule it:
        # unlike the settings above there is no live/offline disagreement to
        # arbitrate, because the score is measured on whole rounds the fit
        # never saw.
        #
        # WHAT TO WATCH LIVE: the `per kind` counts in the play log. Today they
        # reshuffle every time the palette is refit; with this on they should
        # hold steady across FEVER and across rounds. If the count collapses
        # instead, remove the line -- that is the whole revert -- and re-fit
        # with a different -k.
        #palette: models/palette.json

        # `verify_reach` -- ASK THE GAME BEFORE THE DRAGS LIKELY TO BE WRONG.
        # The most promising of the opt-in rules, and the only one so far
        # measured against the game's own answers on real played drags rather
        # than against hand labels.
        #
        # THE PROBLEM IT ATTACKS. Over 303 collected drags at the settings
        # above, the game refused 27% of the chain members the bot proposed,
        # and on 22% of drags what was left fell under min_chain -- the stroke
        # runs, walks the board, and clears nothing. Neither `link_px` nor
        # colour can predict which: leg length separates a good member from a
        # rejected one by 0.06 standard deviations, i.e. not at all.
        #
        # WHAT DOES PREDICT IT is how far the chain reaches from the tsum being
        # pressed. Share of drags where the game accepted EVERY member:
        #     under 90px  100%        220-300px    33%
        #      90-150px    81%        over 300px   11%
        #     150-220px    65%
        # `--verify-hold` buys the game's opinion on every drag, and that is
        # why it loses: the check costs the same each time, the risk does not.
        # This buys it only past a reach.
        #
        # WHAT IT SHOULD BE WORTH, replayed over those 303 drags with the
        # game's recorded answers, counting a drag as clearing only if every
        # member was accepted:
        #     off (today)   688 tsums cleared, 10.6 per second of stroke
        #     260px         819 cleared (+19%), 12.7/s (+20%), checking 18%
        #                   of drags
        #     every drag    906 cleared but 7.9/s (-26%) -- the check swamps
        #                   the gain, which is `--verify-hold`
        # 260 was best or near-best under both a one-frame and a three-frame
        # reading cost, which is why it is the number suggested rather than
        # the 220 that wins on one of them only.
        #
        # WHY IT IS STILL OFF. The replay assumes a drag clears nothing when
        # any member is refused -- the behaviour the code notes elsewhere
        # ("a 3-chain it only marks two of pops nothing at all"). If the game
        # is instead lenient and clears the good members anyway, today already
        # gets everything and this buys nothing. Offline cannot tell those two
        # apart. A round can, which is the usual rule here.
        #
        # WHAT TO WATCH LIVE: the play log's end-of-round line now reports
        # `checked N chain(s) before dragging (M% of drags)` next to the
        # trimmed/rejected counts -- cost and benefit side by side. Expect M
        # near 20%. If it is near zero the threshold is too high for your
        # boards; if it is most of them, too low. `cleared` is the number that
        # decides, and `--verify-clears` is what measures it.
        verify_reach: "${verify_reach}"

        # `verify_clears` -- MEASURE WHAT ACTUALLY LEFT THE BOARD.
        # Not a play rule: a measurement, and the one this project owes
        # itself. Everything `verify_reach` claims rests on the assumption
        # that a drag with one refused member clears NOTHING -- the behaviour
        # the code notes elsewhere as "a 3-chain it only marks two of pops
        # nothing at all". If the game is lenient and pops the accepted
        # members anyway, today already gets those tsums and the check above
        # buys delay and nothing else. No collection can tell those apart,
        # because none of them ever recorded what cleared.
        #
        # Turning this on makes the loop re-read the board after each drag
        # and count what left it, which is exactly that missing number.
        #
        # WHAT IT COSTS: not a capture. `--verify` already grabs the frame
        # this reads, so the price is a few per-disk means -- milliseconds.
        # The comment here used to say "a capture per drag" and was simply
        # wrong; it is cheap enough to leave on for every round, and from
        # schema 3 the count lands in `samples.jsonl` beside the chain that
        # earned it, so leaving it on means every future corpus carries the
        # one number that is not a proxy. `PlayReport.cleared` and the
        # `tsum_tsums_cleared` variable carry it live.
        #
        # HOW TO TURN IT ON: tick "Measure tsums cleared" in the panel, or set
        # `verify_clears: true` in this flow's `vars:` at the top.
        verify_clears: "${verify_clears}"

        # `verify_extend` -- SPEND THE CHECK'S ANSWER ON BOTH HALVES OF IT.
        # `verify_reach` above presses, reads which tsums the game lights up,
        # and uses that answer only to take members AWAY. The same reading
        # also names partners the proposal never contained, and they are free:
        # the press has been paid for already.
        #
        # THE SIZE OF WHAT IS BEING THROWN AWAY, over 4,306 collected drags:
        # the game marks a mean 6.1 tsums per press, the bot proposes 4.8 and
        # drags 3.4 after the trim -- and 4.0 marked tsums per press were
        # never proposed at all. That gap is the biggest single number in the
        # collection.
        #
        # WHY THE GRAPH CANNOT REACH THEM, which is the finding that makes
        # this a rule rather than a wish: `adjacency()` will not link two
        # tsums whose `kind` differs, and `kind` is a per-frame k-means id.
        # Rebuild the chain from the marks using the bot's own ids and it gets
        # SHORTER -- 29% fewer tsums cleared. Rebuild it treating what the
        # game lit as the pressed character and it gets longer. The recall gap
        # is a colour problem wearing a graph's clothes, and the press is the
        # one moment the colour question has an authoritative answer.
        #
        # WHAT IT SHOULD BE WORTH, replayed over those drags with the game's
        # recorded answers, against the trim AT AN IDENTICAL READING COST:
        #     cheap read (0.17s)   trim 10.58 clears/s   rebuild 11.18  +5.7%
        #     mid read   (0.28s)   trim  9.68            rebuild 10.27  +6.0%
        #     3-frame    (0.41s)   trim  8.81            rebuild  9.37  +6.3%
        # The same sign and the same size in all three columns, which is the
        # test a rule has to pass here -- 1,033 more tsums cleared on the same
        # 853 holds, for 37s more stroke. It also LENGTHENS chains rather than
        # shortening them: the 6+ share rises with the total, 6.7% -> 9.4%, so
        # it is not the truncation trade in a new dress. The marks grew 323 of
        # the 853 checked chains.
        #
        # WHAT WOULD FALSIFY IT. Two things, and both need a round:
        #   * The marks are read at 8x the board's noise floor over ONE frame
        #     live, where the corpus read them over three. If a single frame
        #     at that bar is dirtier than the collector's, the rebuilt chains
        #     will contain tsums that are not partners -- a score popup
        #     drifting across the board reads as a mark.
        #   * It assumes the game accepts a member it MARKED. That is the same
        #     assumption `verify_reach` rests on, now load-bearing twice, and
        #     `verify_clears` above is still the only thing that can settle it.
        #
        # WHAT TO WATCH LIVE: the end-of-round line reports `the marks rebuilt
        # N chain(s) (M% of checks), adding K member(s)` right after the
        # `checked N chain(s)` cost. Both halves of the trade in one line. If
        # M is near zero the marks are adding nothing and the rule is only
        # costing a stricter bar; if `dragged` climbs but `cleared` does not,
        # the rebuilt members are not really partners -- turn it off.
        #
        # HOW TO TURN IT ON: tick "Rebuild chains from marks" in the panel, or
        # set `verify_extend: true` in this flow's `vars:` at the top.
        verify_extend: "${verify_extend}"

        # `verify_no_trim` -- KEEP THE REBUILD, DROP THE TRIM.
        # See the `vars:` block at the top for the measurement and the
        # revert. Off by default there; this line is what carries it down.
        verify_no_trim: "${verify_no_trim}"

        # `recolour` -- see the `vars:` block at the top for the measurement,
        # the threshold to try, and the revert.
        recolour: "${recolour}"

  - find_click:
      template: cancel_button
      timeout: 6.5
    optional: true

  # `until_found` is only tested between drags, so a banner that is up for a
  # second or two can come and go inside one drag and never be seen. Two
  # endings are listed rather than one -- the loop stops on whichever it
  # notices first, and `gameplay_clock_zero` is on screen for the run-up to
  # `timeup` rather than for a moment. `duration` is still the last resort if
  # both are missed.
  #
  # `scoreboard` would be a third, and it is the state the next step waits for
  # anyway -- but only add it after checking it does NOT match mid-round with
  # `python main.py find scoreboard` during play, or the round will end early.
  - if_found:
      template: raised_level_cap
      timeout: 5
      then:
      - set: {level_cap_found: true}

  - if_found:
      template: announcement_close_button
      timeout: 10
      then:
      - find_click: {template: announcement_close_button, timeout: 3}
        optional: true

  - wait_for:
      template: scoreboard
      timeout: 30

  # Results, coin bonus, "next" -- these tap through whatever the game puts up
  # until the main screen is back. Optional so a screen that doesn't appear
  # this run doesn't fail the flow.
  - repeat:
      times: 8
      stop_on_failure: true
      delay: {min: 0.5, max: 0.9}
      steps:
        - find_click:
            template: announcement_close_button
            timeout: 3
    optional: true

  - wait_for:
      template: play_button
      timeout: 30
    optional: true

  # The round is over but the main screen never came back. Either the results
  # are still tapping through -- in which case a landmark is on screen and this
  # costs milliseconds -- or the game has hung, and nothing further in this
  # flow or the caller's loop will work until the emulator is restarted.
  - if:
      value: "${stuck_check}"
      then:
        - screen_stuck:
            seconds: 30
            alive: [play_button, scoreboard, gameplay_footer, announcement_close_button]
            save_as: game_frozen
        - if:
            value: "${game_frozen}"
            then:
              - run_flow:
                  flow: recover_to_home
              - run_flow:
                  flow: launch_tsum
                optional: true
