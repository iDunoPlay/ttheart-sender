name: play_round
description: Start a round from the main screen, play the board, clear the results

# Assumes the main screen is already up (play_button visible) -- `launch.yaml`
# gets you there. Call it from another flow with:
#
#   - run_flow: play
#
# and stop it at any time with the stop key (F12 by default).
vars:
  # WHAT THIS BLOCK IS: the value and the revert for every tunable, one line
  # each. The workings are not here. Every measurement below is written up by
  # round in docs/DATASET-FINDINGS.md, and the long commentary these options
  # used to carry inline is in git history.
  #
  # HOUSE RULE: a new detection or play rule ships OFF, and the revert is
  # setting its line back to the value here. Turn them on ONE AT A TIME -- they
  # touch different parts of the pipeline, and flipping several at once tells
  # you nothing about which was at fault.

  level_cap_found: false

  # Stuck/crash watchdog. A screen showing none of the known landmarks AND
  # unchanged for thirty seconds is treated as a wedged game and restarts the
  # emulator. Stillness alone is never enough: a healthy menu is
  # pixel-identical too. Off; set true to arm.
  stuck_check: false

  # Restarts for the per-frame colour fit. THE DEFAULT SINCE THE THIRTEENTH
  # ROUND: two reads of one board agree on 91% of tsums at 3 against 73% at 1,
  # and 4,306 drags gave up nothing against the level-1 baseline. Costs ~1.5s
  # a round, because the loop caches centres and fits about five times.
  # Set 1 to revert.
  fit_effort: 3

  # Count what actually left the board after each drag. ON PERMANENTLY: it
  # reads the frame `verify` already grabbed, so it costs milliseconds, and it
  # is the ruler every other rule here is priced with. Off makes a round
  # unmeasurable rather than faster.
  verify_clears: true

  # Sort the board into a fixed number of identities by face colour, instead of
  # trusting the pixel-level k-means. 0 = off.
  # THE GAME SUPPLIES THE BOUND: a board holds at most 5 characters, 4 with an
  # item. That is what makes a COUNT safe where `recolour`'s distance threshold
  # was not -- a count cannot run away.
  # Scored over 1,117 saved boards in tsums cleared per drag: 3.26 today, 3.41
  # at 4 (+4.3%), 3.35 at 5, 3.23 at 6. On sessions held out: +3.6% at 4, +4.1%
  # at 5. An interior optimum, and a small win.
  # Try 4. Revert to 0. Costs ~2ms a frame. Rounds 23-24.
  kinds: 0

  # `character` -- NAME THE CHARACTER INSTEAD OF CLUSTERING ITS COLOUR.
  #
  # A classifier trained on 3,791 hand-labelled crops, held out by session:
  # 97.5% accurate on the 15 well-populated classes. What it replaces is a
  # per-frame k-means `kind`, which agrees with the game about a confirmed
  # partner 37% of the time. That is not a tuning difference.
  #
  # HYBRID, and that is the safety of it. A crop the model is unsure of keeps
  # the k-means `kind` it already had, so a character nobody has labelled plays
  # exactly as it does today and a labelled one plays better. Costs ~11ms on a
  # 46-tsum board against a ~100ms decision.
  #
  # WHAT IT CANNOT DO, measured against the game's own marks over 94 sessions
  # no labelled crop came from: above 0.55 visible it agrees with the confirmed
  # character 74% of the time, and BELOW 0.55 it is at the 12.5% chance rate --
  # at unchanged confidence the whole way down. `character_min_visible` is what
  # holds that line; do not lower it without re-running scripts/mark_probe.py.
  # The median detection on a board shows 0.41, so this names about a fifth of
  # it and leaves the rest to k-means on purpose.
  #
  # OFF until a round says otherwise -- this has never been played, and the
  # thirtieth round found score turns on FEVER share rather than on clear rate,
  # so a better identity may not move the score at all. Set the path to arm it;
  # revert to "". Requires models/character.onnx (+ .json), built by
  # `scripts/classify.py --split random --onnx models/character.onnx`.
  # Round 31.
  character: ""
  character_confidence: 0.85
  character_min_visible: 0.55

  # `reject_model` -- DROP DETECTIONS THAT ARE BOARD, NOT A TSUM.
  #
  # The player's own report: some detections "shouldn't be detected as it is
  # background or unknown object, which is invalid for the gameplay". A false
  # detection carries a `kind` like any other, so `adjacency` will chain it and
  # the stroke passes over empty bowl -- a chain slot spent on nothing, and one
  # more `dragged` that never clears.
  #
  # Trained on 705 crops labelled `board` on purpose. The label is clean: over
  # the whole corpus the game marked 0.0% of them and none was ever a chain
  # head. Held out by session it reads 0.998 AUC and drops ~2% of a board.
  #
  # WHAT IT COST TO GET RIGHT, because the failure is not obvious. The board is
  # printed with empty tsum-shaped SLOTS, and a tsum the game has linked is
  # drawn as a flat SILHOUETTE -- same outline, same flat fill. Trained on
  # `board` alone the net scored 1.000 AUC and threw away game-confirmed tsums
  # at 20.8% against 16.6%. Marked detections had to be harvested as positives
  # before its rejections stopped being enriched for real tsums.
  #
  # WHAT IS STILL UNKNOWN. After that fix its rejections are confirmed by the
  # game 15.4% of the time against a 17.2% base rate -- no longer harmful, and
  # only just better than chance. That test can rule a filter OUT and cannot
  # certify one, so this is where the offline work stops.
  #
  # OFF. Set to models/reject.onnx to arm it; revert to "". Watch `dragged`
  # falling while `cleared` holds, which is the whole claim. If `cleared` falls
  # with it, it is eating real tsums -- revert. Round 34.
  reject_model: ""
  reject_floor: 0.10

  # `chain_model` -- PICK THE CHAIN THE GAME WILL ACCEPT, NOT THE LONGEST ONE.
  #
  # The bot has always sorted candidates by (is_base, length). Over 7,352
  # proposed members the game accepts 97.9% of first members and 19.1% of
  # sevenths, and once it refuses one it refuses 86% of what follows -- so
  # longest-first optimises the end of the chain that does not survive.
  #
  # This scores each candidate as EXPECTED ACCEPTED MEMBERS and plays the best.
  # Offline, on rounds the model never trained on: the per-member model reads
  # 0.876 AUC against `adjacency`'s 0.500, the expected total is calibrated
  # (predicted 2.274 against 2.310 actually accepted), and re-ranking is worth
  # +0.109 accepted members a press -- which survives being scored by a second,
  # independently trained model, so it is not an argmax flattering itself.
  #
  # NEVER PLAYED. +0.109 on 2.31 is +4.7%, and this corpus needs ~136 rounds an
  # arm to resolve that on accepted-per-press, ~204 on `cleared`. OFF; set to
  # models/chain.onnx to arm it, revert by clearing the line. Watch accepted
  # members per press and `cleared`; the board filter is the reminder that a
  # good offline number is not a good round.
  chain_model: ""
  chain_bonus: 0.0

  # A/B: alternate one option between rounds, one on and the next off.
  # `ab` names the play option to alternate and `ab_off` is the value it takes
  # on its OFF rounds; the ON value is whatever that option is already set to
  # above. Empty = no A/B, which is the default and the baseline.
  #
  # To run the board-filter experiment: set `reject_model` to
  # models/reject.onnx, `ab` to reject_model, and leave `ab_off` empty. Revert
  # by clearing `ab`.
  #
  # The arm is chosen INSIDE the play loop, not here, so no flow hop can drop
  # it -- and it records itself, because what changes is the option's own
  # value and every sample carries the whole option set. Read the result with
  # `scripts/ab_eval.py`.
  ab: ""
  ab_off: ""

  # `settle_board` -- WAIT FOR THE BOARD, NOT FOR THE WHOLE SCREEN.
  #
  # Aimed at the biggest number in a round, which nobody had measured until
  # now. Over 26 logged rounds the gap between one chain and the next averages
  # 839ms: 144ms of it is thinking and 695ms is the stroke and the wait for the
  # board to stop moving. Detection is 17% of a round. Everything after the
  # decision is 83%.
  #
  # THE PREMISE ABOVE DID NOT SURVIVE. It read: "score tracks CHAINS PLAYED
  # (r=+0.91) and not mean chain length (r=+0.06), so more chains per round is
  # the objective". That was five rounds. Over the 140 scored rounds of the
  # clean single-build baseline of 2026-09-05 it FLIPS SIGN -- chains played
  # correlates -0.17 with score, cleared +0.77 and FEVER +0.73. More chains per
  # round is not the objective, and the five-round number was noise.
  #
  # Left armed and documented rather than deleted: the wait itself is still the
  # biggest slice of a round, and this may yet pay for a reason other than the
  # one it was proposed for. It is simply no longer next in line.
  #
  # The wait compares two whole frames. The score counter ticks, the round
  # timer runs and the FEVER meter fills -- continuously, and all of them
  # OUTSIDE the board -- so it can sit at its 0.9s cap long after the tsums
  # have stopped falling. `cleared_by_drag` already records this about
  # whole-frame diffs; this applies the same fix to the wait.
  #
  # OFF until a round says otherwise, and the round now reports the number to
  # judge it on: `waited Ns for the board to settle (Nms a drag, N% hit the
  # cap)`. Watch for `played N chains` rising. If chains rise but `cleared %`
  # falls, it is dragging on a board still in motion -- revert to false.
  settle_board: false

  # `step_px` -- HOW FAR THE CURSOR MOVES BETWEEN INTERPOLATION STEPS.
  #
  # The second throughput lever, after `settle_board`. The stroke sleeps
  # `per_step` (4ms) at every step, and a step is `step_px` along the path -- so
  # a 4-member chain with ~90px legs walks ~38 steps and spends ~165ms sleeping
  # before any of the other per-step cost. Doubling this halves that.
  #
  # WHY IT IS WORTH A LOOK. Measured over 21 rounds that recorded clears:
  #     clears/second vs CHAINS/second      r = +0.978
  #     clears/second vs mean chain length  r = +0.169
  # Throughput is the whole of it, and chain length is a wash -- longer chains
  # clear more per drag at a worse rate and the two cancel (clear% vs length
  # r = -0.733). So the way to clear more is more drags per second, and 83% of
  # a drag cycle is the stroke and the settle wait.
  #
  # NOT the same risk as `per_step`. Slowing per_step is what the stall
  # detector does when a drag fails to register, and it self-corrects. A step
  # that is too LONG fails differently: the drag still registers, but the
  # pointer can skip past a tsum, so members go unaccepted and nothing says so.
  # WHAT TO WATCH: `cleared N (M%)` must HOLD. If chains rise and the clear
  # share falls, the stroke is skipping members -- revert to 8.
  # Try 12 before 16. Revert to 8.
  step_px: 8

  # Throw away detections that landed on the bowl rather than on a tsum, by Lab
  # distance from the board's own colour. 0 = off.
  # 40 RATHER THAN 60 BECAUSE A PLAYED ROUND SAID SO: offline f1 puts 60 a
  # fraction ahead (0.791 vs 0.785, inside the noise over ten boards) and live
  # 60 takes real tsums out of the middle of chains.
  bowl_reject: 40

  # `verify_extend` -- REBUILD A CHECKED CHAIN FROM WHAT THE GAME MARKED,
  # instead of only trimming it. Rides on the `verify_reach` check that is
  # already paid for, so it costs no capture of its own.
  #
  # ON, and this is where it stops being an experiment. It was the panel's
  # "Rebuild chains from marks" box and it was ticked for **248 consecutive
  # rounds** -- every round in docs/DATASET-FINDINGS.md from the twenty-ninth
  # onward. When the panel became a radio group, choosing any other experiment
  # silently unticked it, and the 18 rounds that followed are the only ones
  # ever played without it.
  #
  # WHAT THOSE 18 ROUNDS SAY, and it is not what the clear rate suggests:
  #     clear rate     76.5% on  vs  61.8% off   p=0.009   REAL
  #     tsums CLEARED  272   on  vs  259.5 off   p=0.49    no difference
  #     tsums dragged  372   on  vs  403   off   p=0.11
  #     score          508k  on  vs  387k  off   p=0.25
  # It does not clear more. It drags LESS for the same clears, so the rate
  # moves because the denominator falls. On score -- the objective, per the
  # thirtieth round -- 18 rounds cannot tell.
  #
  # It is here rather than in the radio because it was on for the whole
  # corpus, so it IS the baseline: leaving it as one experiment among five
  # meant every other experiment silently turned it off as well, and no
  # comparison after that could say which change it was measuring. Revert by
  # editing this line, the way `fit_effort` is reverted. Round 35.
  verify_extend: true

  # Reach in px past which a chain is checked against the game's marks before
  # being dragged. 0 turns every check off, and the rebuild with it.
  # 0 SINCE THE SEVENTEENTH ROUND: re-swept over 404 drags, NOT checking beat
  # every way of checking -- 12.51 clears/s against 10.87 for the trim and
  # 11.29 for the rebuild. 260 was the shipped value before that, and is the
  # number to restore if this is ever tried again.
  verify_reach: 0
steps:
  # Clear anything left over from a previous round (the score tally, the High
  # Score popup, a login bonus) before looking for Play. Without this the flow
  # only works from a clean main screen, which is exactly the state it is NOT
  # in when it loops back around after playing.
  - repeat:
      times: 6
      stop_on_failure: true
      delay: {min: 0.4, max: 0.7}
      steps:
        - find_click:
            template: announcement_close_button
            timeout: 3
    optional: true

  # Main screen -> the pre-match screen with the equipped tsum and Start.
  - find_click:
      template: play_button
      timeout: 15
      
  - wait_for:
      template: combo_items
      timeout: 15

  - find_click:
      template: start_button
      timeout: 15

  # Nothing is dragged until the in-play UI is actually up. play_tsum has no
  # countdown of its own, so this wait_for IS the countdown -- and it waits on
  # the real thing rather than guessing how long the 3-2-1 takes.
  - wait_for:
      template: gameplay_footer
      timeout: 20

  - wait_for:
      template: go
      timeout: 4

  # The round itself. It ends when the results screen appears; `duration` is
  # only the backstop for a round where that template never matches, so keep it
  # comfortably longer than a real round (60s, plus whatever FEVER adds).
  #
  # Every knob the `play` command has is available under `options:` -- e.g.
  # {min_chain: 4, per_step: 0.006, base_only: true}. Unknown names are
  # rejected when the step runs rather than silently ignored.
  - play_tsum:
      duration: 300
      until_found: [timeup, tsum_score, last_bonus, scoreboard]
      require_played: 1
      options:
        min_chain: 3
        max_chain: 12

        # How far apart two tsums can sit and still be joined, in px. A tsum is
        # ~46px across, so 105 is "touching, or one small gap apart". Raise it
        # and the bot finds longer chains that are longer on paper only -- the
        # game refuses the far members. 150 was tried live and was clearly
        # worse.
        link_px: 105

        # How close another tsum must sit to the line between two others to
        # count as blocking, in tsum radii. 0.75 was too low: that is ~19px
        # against a ~25px tsum, so one lying bodily across the line did not
        # count as being in the way.
        block: 1.25

        # Measure the tsum radius over the first N board-like frames, then hold
        # it for the round. 0 = off.
        # THIS IS THE FEVER FIX. The size cannot change during a round, but the
        # estimator re-ran whenever the colour fit was dropped -- including on
        # the FEVER transition, the dimmest and most animated frame there is,
        # where it read 8-38px on a ~26px board. A halved radius roughly
        # DOUBLES the detection count and still passes the sanity range, so
        # phantom chains were found, dragged, and cleared nothing -- and
        # because chains were found, the "nothing playable" recovery never ran
        # either. Watch for `radius locked at NNpx` once a round; under ~20
        # means the warm-up caught a bad patch, so raise this.
        radius_lock: 6

        # Let FEVER be read on fewer tsums. 0 = off.
        # `min_tsums` (20) is a "this is not a board" test, not a quality bar --
        # it stops the bot swiping live buttons on the Home screen. FEVER dims
        # and overlays the board, so a playable frame reads ~20 detections where
        # normal play reads ~50, sitting right on that floor. Safe to lower
        # ONLY during FEVER, because the FEVER template has already proved the
        # frame is a board before this is consulted.
        fever_min_tsums: 12

        # The tunables. See the `vars:` block at the top of this file for what
        # each one does, the value to try, and the revert.
        bowl_reject: "${bowl_reject}"
        fit_effort: "${fit_effort}"
        verify_reach: "${verify_reach}"
        verify_clears: "${verify_clears}"
        settle_board: "${settle_board}"
        step_px: "${step_px}"
        verify_extend: "${verify_extend}"
        kinds: "${kinds}"
        character: "${character}"
        character_confidence: "${character_confidence}"
        character_min_visible: "${character_min_visible}"
        reject_model: "${reject_model}"
        reject_floor: "${reject_floor}"
        ab: "${ab}"
        ab_off: "${ab_off}"
        chain_model: "${chain_model}"
        chain_bonus: "${chain_bonus}"
  - find_click:
      template: cancel_button
      timeout: 6.5
    optional: true

  # `until_found` is only tested between drags, so a banner that is up for a
  # second or two can come and go inside one drag and never be seen. Two
  # endings are listed rather than one -- the loop stops on whichever it
  # notices first, and `gameplay_clock_zero` is on screen for the run-up to
  # `timeup` rather than for a moment. `duration` is still the last resort if
  # both are missed.
  #
  # `scoreboard` would be a third, and it is the state the next step waits for
  # anyway -- but only add it after checking it does NOT match mid-round with
  # `python main.py find scoreboard` during play, or the round will end early.
  - if_found:
      template: raised_level_cap
      timeout: 5
      then:
      - set: {level_cap_found: true}

  - if_found:
      template: announcement_close_button
      timeout: 10
      then:
      - find_click: {template: announcement_close_button, timeout: 3}
        optional: true

  - wait_for:
      template: scoreboard
      timeout: 30

  # KEEP THE RESULTS SCREEN. One frame, once a round, the moment the scoreboard
  # is up and before the next step taps it away.
  #
  # WHY IT IS WORTH A LINE: every A/B this project has run -- 23 rounds of them
  # -- was scored on `cleared`, the count of tsums removed from the board. That
  # is a proxy. The game scores superlinearly in chain length and the round is
  # dominated by fever, bombs and combo, so four 3-chains and one 12-chain
  # clear the same twelve tsums and score nothing alike. Whether the proxy even
  # tracks the score has never been checked, because the number was thrown away
  # every round.
  #
  # This does not read the score yet. It stops discarding it, which has to come
  # first. Frames land in the debug directory; `scripts/rounds.py` is where the
  # reading will hang off once there are enough to work from.
  - screenshot: results
    optional: true

  # Results, coin bonus, "next" -- these tap through whatever the game puts up
  # until the main screen is back. Optional so a screen that doesn't appear
  # this run doesn't fail the flow.
  - repeat:
      times: 8
      stop_on_failure: true
      delay: {min: 0.5, max: 0.9}
      steps:
        - find_click:
            template: announcement_close_button
            timeout: 3
    optional: true

  - wait_for:
      template: play_button
      timeout: 30
    optional: true

  # The round is over but the main screen never came back. Either the results
  # are still tapping through -- in which case a landmark is on screen and this
  # costs milliseconds -- or the game has hung, and nothing further in this
  # flow or the caller's loop will work until the emulator is restarted.
  - if:
      value: "${stuck_check}"
      then:
        - screen_stuck:
            seconds: 30
            alive: [play_button, scoreboard, gameplay_footer, announcement_close_button]
            save_as: game_frozen
        - if:
            value: "${game_frozen}"
            then:
              - run_flow:
                  flow: recover_to_home
              - run_flow:
                  flow: launch_tsum
                optional: true
