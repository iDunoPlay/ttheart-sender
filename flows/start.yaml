name: click_tsumtsum
description: Detect LDPlayer, launch TsumTsum, and clear the root-detection prompt

steps:
  # `python main.py run` already detects + parks LDPlayer before this flow
  # starts. This step is here too so the flow still works standalone if it's
  # ever called from another flow via run_flow.
  - prepare_window

  - find_click:
      template: tsumtsum
      timeout: 30
      save_as: tsumtsum_pos

  # The app shows a "Root Detection" dialog on some launches, not every time
  # (only when LDPlayer looks rooted to it, which it usually does). Optional
  # so a launch that skips the dialog doesn't fail the flow.
  - wait_for:
      template: permit_button
      timeout: 30

  - find_click:
      template: permit_button
      timeout: 8
    optional: true

  - wait: {min: 4.5, max: 6}

  # Second tap at the exact same spot as the first -- not a re-scan, since the
  # icon may already be mid-launch (highlighted/animating) and no longer match
  # the template.
  # Skip app animation
  - click:
      at: ${tsumtsum_pos}
      space: screen

  # Click tap to start
  - find_click:
      template: tap_to_start_button
      timeout: 8

  # Block here until the main screen has actually loaded -- don't touch
  # anything else until play_button is on screen.
  - wait_for:
      template: play_button
      timeout: 30

  # Close any announcement(s). No blind wait needed -- find_click's own
  # timeout already polls until the button appears, so each iteration gives
  # the next announcement 3s to render. The first iteration where nothing
  # shows up in that window is the exit: find_click fails, stop_on_failure
  # ends the loop, and `optional` on the repeat itself keeps that expected
  # failure from failing the flow. times caps a stuck screen at 20 clicks.
  - repeat:
      times: 20
      stop_on_failure: true
      delay: {min: 0.4, max: 0.7}
      steps:
        - find_click:
            template: announcement_close_button
            timeout: 3
    optional: true

  # Everything below is the repeatable cycle: check mailbox, do the ranking /
  # heart-sending pass, go home, and loop back to the mailbox check again.
  # Runs until you stop it (F12) -- this is a live bot loop, not a one-shot.
  - repeat:
      forever: true
      steps:
        # Open the mailbox whichever state it is in. The badge changes the
        # icon enough that one template cannot cover both (plain mailbox.png
        # only scores ~0.80 against the badged icon, under the 0.85 threshold),
        # so look for the badged version first and fall back to the plain one.
        # `then` and `else` must line up with `template` -- indent them any
        # further left and YAML hands them to the step instead of to if_found,
        # which drops the branch without any error.
        - if_found:
            template: mailbox_with_red
            timeout: 5
            then:
              # Receiving all gift from mailbox
              - find_click: {template: mailbox_with_red, timeout: 3}
            else:
              - find_click: {template: mailbox, timeout: 5}

        - wait: 2

        # Shared with start.yaml -- edit flows/claim_mailbox.yaml.
        - run_flow: claim_mailbox

        - find_click:
            template: announcement_close_button
            timeout: 4

        - wait: {min: 0.4, max: 0.7}

        - run_flow: send_heart

        - wait: 3

        # play game
        - chance:
            percent: 8
            then:
            - run_flow: play

        - wait: {min: 75, max: 110}


