name: click_tsumtsum
description: Detect LDPlayer, launch TsumTsum, and clear the root-detection prompt

vars:
  # Forwarded to resume.yaml at the bottom of this file -- see the note there.
  # The tray's "Play rounds" tick overrides this with 0; a console run uses the
  # value here unless `--var play_chance_percent=N` says otherwise.
  play_chance_percent: 8

steps:
  # `python main.py run` already detects + parks LDPlayer before this flow
  # starts. This step is here too so the flow still works standalone if it's
  # ever called from another flow via run_flow.
  - prepare_window

  - find_click:
      template: tsumtsum
      timeout: 30
      save_as: tsumtsum_pos

  # The app shows a "Root Detection" dialog on some launches, not every time
  # (only when LDPlayer looks rooted to it, which it usually does). Optional
  # so a launch that skips the dialog doesn't fail the flow.
  - wait_for:
      template: permit_button
      timeout: 30

  - find_click:
      template: permit_button
      timeout: 8
    optional: true

  - wait_for:
      template: animation
      timeout: 30
    
  - click: [267, 567]

  # Click tap to start
  - find_click:
      template: tap_to_start_button
      timeout: 8

  # Block here until the main screen has actually loaded -- don't touch
  # anything else until play_button is on screen.
  - wait_for:
      template: play_button
      timeout: 30

  # Close any announcement(s). No blind wait needed -- find_click's own
  # timeout already polls until the button appears, so each iteration gives
  # the next announcement 3s to render. The first iteration where nothing
  # shows up in that window is the exit: find_click fails, stop_on_failure
  # ends the loop, and `optional` on the repeat itself keeps that expected
  # failure from failing the flow. times caps a stuck screen at 20 clicks.
  - repeat:
      times: 20
      stop_on_failure: true
      delay: {min: 0.4, max: 0.7}
      steps:
        - find_click:
            template: announcement_close_button
            timeout: 3
    optional: true

  # Resume flow. Pass play_chance_percent explicitly: run_flow applies the
  # called flow's own `vars:` on entry, so resume.yaml's 8 would otherwise
  # overwrite whatever the tray (or --var) set here.
  - run_flow:
      flow: resume
      vars: {play_chance_percent: "${play_chance_percent}"}


