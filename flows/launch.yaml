name: click_tsumtsum
description: Detect LDPlayer, launch TsumTsum, and clear the root-detection prompt

vars:
  # All four are forwarded to resume.yaml at the bottom of this file -- see
  # the note there for why that has to be spelled out.
  #
  # The tray's "Auto Play" tick drives this: 100 when ticked, 0 when not. A
  # console run uses the value here unless `--var play_chance_percent=N` says
  # otherwise.
  play_chance_percent: 8

  # The tray's "Return Heart" section. Off means resume.yaml sends hearts
  # every cycle, the way it always has; on means only at the minutes below.
  return_heart_timed: false
  return_heart_minutes: [15, 50]

  # The tray's "Claim pattern" radio. false = tap Check on one mailbox item at
  # a time, true = one pass through the game's own Claim All dialog.
  claim_all: false

  # Forwarded to resume.yaml like the four above. Off by default; see the
  # note beside the same switch in resume.yaml for what arming it does.
  stuck_check: false

steps:
  # `python main.py run` already detects + parks LDPlayer before this flow
  # starts. This step is here too so the flow still works standalone if it's
  # ever called from another flow via run_flow.
  - prepare_window

  # The normal path: one straight run at the game. Optional because a miss here
  # is not the answer yet -- the loop below is -- and a required step that
  # failed would mark the whole run failed even after the retry recovered it.
  - run_flow:
      flow: launch_tsum
    optional: true

  # play_button on the main screen is the only proof the game actually came up.
  # Everything that can stop it -- an LDPlayer ad over the icon, a boot that
  # hangs on the splash, a game update part way through -- looks identical from
  # out here and has the same answer: throw the emulator away and try again.
  #
  # `until_found` is checked *before* every pass, so a launch that already
  # worked skips the loop entirely and a restart that worked exits at the top
  # of the next pass, before spending another one. Three passes = three
  # restarts.
  - repeat:
      until_found: play_button
      max_iterations: 3
      steps:
        - run_flow:
            flow: restart
        - run_flow:
            flow: launch_tsum
          optional: true

  # The verdict, and it has to live out here: `until_found` is only tested at
  # the *top* of a pass, so a game that came up on the third and last restart
  # is never seen by the loop itself -- it just runs out of passes and reports
  # nothing. This is the check that decides, and giving up here stops
  # resume.yaml being let loose on a screen with no game on it.
  - if_found:
      template: play_button
      timeout: 10
      else:
        - stop:
            message: play_button never appeared after 3 restarts -- giving up
            success: false

  # Close any announcement(s). No blind wait needed -- find_click's own
  # timeout already polls until the button appears, so each iteration gives
  # the next announcement 3s to render. The first iteration where nothing
  # shows up in that window is the exit: find_click fails, stop_on_failure
  # ends the loop, and `optional` on the repeat itself keeps that expected
  # failure from failing the flow. times caps a stuck screen at 20 clicks.
  - repeat:
      times: 20
      stop_on_failure: true
      delay: {min: 0.4, max: 0.7}
      steps:
        - find_click:
            template: announcement_close_button
            timeout: 3
    optional: true


  # Resume flow. Every override is passed explicitly: run_flow applies the
  # called flow's own `vars:` on entry, so resume.yaml's defaults would
  # otherwise overwrite whatever the tray (or --var) set here.
  - run_flow:
      flow: resume
      vars:
        play_chance_percent: "${play_chance_percent}"
        return_heart_timed: "${return_heart_timed}"
        return_heart_minutes: "${return_heart_minutes}"
        claim_all: "${claim_all}"
        stuck_check: "${stuck_check}"
