name: claim_mailbox
description: Claim everything in an already-open mailbox

# Shared building block, not a standalone routine. It assumes the mailbox is
# already open and finished loading -- getting there is the caller's job,
# because launch.yaml and resume.yaml open it under different conditions.
#
# Use it from any other flow with:
#
#   - run_flow: {flow: claim_mailbox, vars: {claim_all: "${claim_all}"}}
#
# The `vars:` are spelled out because run_flow re-applies the called flow's own
# defaults on entry -- the bare `- run_flow: claim_mailbox` would claim the
# mailbox single-file however the panel is set.
#
# Improve the steps here once and every caller picks the change up.

vars:
  # The panel's "Claim pattern" radio, as a flag:
  #
  #   false -- Single claim. Tap Check on one item at a time until the mailbox
  #            has none left. Slower, but it is the pattern that returns a
  #            requested heart per item, and it is what the panel picks by
  #            default.
  #   true  -- Claim all. One pass through the game's own "Claim All" dialog
  #            with hearts and medals toggled on. Faster, and it takes the
  #            whole mailbox in one go, so nothing is checked item by item.
  #
  # Exactly one of the two runs; a console run says which with
  # `--var claim_all=true`.
  claim_all: false

steps:
    - if:
        value: ${claim_all}

        # -- Claim all ----------------------------------------------------
        then:
        - if_found:
            template: get_coin
            timeout: 4
            then:
                - find_click:
                    template: claim_all_button
                    timeout: 5

                - wait: {min: 0.4, max: 0.7}

                - find_click:
                    template: toggle_hearts_button
                    timeout: 3

                - wait: {min: 0.1, max: 0.3}

                - find_click:
                    template: toggle_medals_button
                    timeout: 3

                - wait: {min: 0.4, max: 0.7}

                - find_click:
                    template: ok_button
                    timeout: 3

                # Which of these two shows depends on whether there was anything to claim,
                # and both fade on their own -- never worth failing the flow over.
                - if_found:
                    template: gift_received
                    timeout: 4
                    then:
                    - find_click: gift_received

                - if_found:
                    template: no_gift_can_claim_all
                    timeout: 4
                    then:
                    - find_click: no_gift_can_claim_all

                - wait: {min: 0.4, max: 0.7}

        # -- Single claim, one item at a time (returns the requested heart) --
        else:
        # while_found is checked before every iteration and ends the loop the first
        # time check_button is not on screen -- an empty mailbox costs one scan
        # instead of ten. `times:` cannot say that: it always runs its full count,
        # and an if_found that takes the else branch still counts as a successful
        # iteration. max_iterations caps a screen that never stops offering hearts.
        - if_found:
            template: get_coin
            timeout: 4
            then:
            - repeat:
                while_found: check_button
                max_iterations: 200
                stop_on_failure: true
                delay: {min: 0.75, max: 1.2}
                # The nested loops below keep their own count under the default
                # name, so this one is spelled out to stay readable in a log.
                counter: item
                steps:
                    # A dialog that is on its way out keeps swallowing taps for
                    # a second or so after its OK button stops matching, and the
                    # mailbox list behind it never stops being visible: Check
                    # sits well above the dialog and goes on matching at 0.98
                    # throughout. Tapping it during that window sends the tap
                    # into the dialog's overlay, not the item -- the log shows it
                    # as an iteration that clicks Check at conf~0.98 and then
                    # finds no ok_button at all, claiming nothing. Waiting the
                    # old dialog out is what makes the next tap land.
                    - wait_until_gone:
                        template: ok_button
                        timeout: 3
                      optional: true

                    - wait: {min: 0.4, max: 0.6}

                    # Then tap Check until the dialog it opens actually shows,
                    # the way a person taps again when nothing happened. The
                    # condition is tested before every pass, so a tap that lands
                    # first time costs one extra scan and no extra tap, while a
                    # tap the game ate is simply repeated instead of writing the
                    # item off for this iteration. Re-tapping is safe: while a
                    # dialog is up it is modal, which is exactly why the stray
                    # taps were being eaten.
                    - repeat:
                        until_found: ok_button
                        max_iterations: 4
                        stop_on_failure: true
                        delay: {min: 0.5, max: 0.8}
                        steps:
                            - find_click:
                                template: check_button
                                timeout: 2
                      optional: true

                    # Tap OK until it is gone, rather than tapping twice at the
                    # same spot and hoping the second one was needed. An item
                    # that claimed itself without a dialog ends this loop on its
                    # first scan, so it costs nothing when there is no dialog.
                    - repeat:
                        while_found: ok_button
                        max_iterations: 4
                        delay: {min: 0.4, max: 0.7}
                        steps:
                            - find_click:
                                template: ok_button
                                timeout: 1
                      optional: true
