name: resume_send_heart
description: Send heart without restart LDPlayer

vars:
  # How often a cycle stops to play a round instead of waiting. The tray's
  # "Auto Play" tick box drives this: 100 when ticked, 0 when not -- the panel
  # has no middle ground any more, it either plays every cycle or none. A
  # console run keeps the finer grain: the value here, or `--var
  # play_chance_percent=N`.
  play_chance_percent: 100

  # "Return Heart" on the panel: send hearts on the clock instead of every
  # cycle. Off here so a console run behaves the way it always has; the tray
  # ticks it on and supplies the two marks from its spinners.
  return_heart_timed: true
  # Minutes of the hour to send on, e.g. [15, 50] = :15 and :50 past every
  # hour. `--var return_heart_minutes=15,50` works too.
  return_heart_minutes: [15, 50]
  # Raised by the time_gate below when a mark goes by, lowered again as soon
  # as the hearts have gone out.
  send_heart_check: false

  # "Claim pattern" on the panel: false = tap Check on one mailbox item at a
  # time (the default), true = one pass through the game's own Claim All
  # dialog. Handed straight to claim_mailbox.yaml, which is where the two
  # patterns live.
  claim_all: false

  # Stuck/crash watchdog. Off, per the house rule for new detection rules --
  # flip this one line to true to arm it, and back to false to revert. When on,
  # every cycle starts by asking whether the screen shows any landmark at all;
  # one that shows none *and* has not changed for thirty seconds is a wedged
  # game,
  # and gets the emulator restarted. Stillness alone is never enough -- a
  # healthy menu sitting idle measures pixel-identical over the same thirty
  # seconds, so it would condemn a screen that is merely not animating.
  stuck_check: false

steps:
  
  # Everything below is the repeatable cycle: check mailbox, do the ranking /
  # heart-sending pass, go home, and loop back to the mailbox check again.
  # Runs until you stop it (F12) -- this is a live bot loop, not a one-shot.
  - repeat:
      forever: true
      steps:
        # Before anything is tapped: is the game still alive? A cycle that
        # blind-taps its way through a frozen screen achieves nothing and
        # hides the problem until morning, which is the whole reason this
        # runs here rather than somewhere further in.
        - if:
            value: "${stuck_check}"
            then:
              - screen_stuck:
                  seconds: 30
                  alive: [mailbox, mailbox_with_red, play_button, home_button, rankings_button]
                  save_as: game_frozen
              - if:
                  value: "${game_frozen}"
                  then:
                    - run_flow:
                        flow: restart
                    - run_flow:
                        flow: launch_tsum
                      optional: true

        # Open the mailbox whichever state it is in. The badge changes the
        # icon enough that one template cannot cover both (plain mailbox.png
        # only scores ~0.80 against the badged icon, under the 0.85 threshold),
        # so look for the badged version first and fall back to the plain one.
        # `then` and `else` must line up with `template` -- indent them any
        # further left and YAML hands them to the step instead of to if_found,
        # which drops the branch without any error.
        - click: [453, 224]

        # Shared with launch.yaml -- edit flows/claim_mailbox.yaml. The var
        # is passed explicitly because run_flow re-applies the called flow's
        # own defaults on entry, which would undo the panel's choice.
        - run_flow:
            flow: claim_mailbox
            vars:
              claim_all: "${claim_all}"

        - run_flow: dismiss_unattended_popup

        - wait: {min: 0.4, max: 0.7}

        # Does this cycle send hearts? Timed, that is once per mark per hour --
        # time_gate raises send_heart_check on the first cycle after :15 or
        # :50 goes by, and stays down in between. Untimed, every cycle sends,
        # which is what this loop did before the panel grew the tick box.
        #
        # A mark that went by before the run started counts as handled, so
        # restarting the bot at :20 waits for :50 rather than firing straight
        # away -- see act_time_gate.
        - if:
            value: ${return_heart_timed}
            then:
            - time_gate:
                minutes: ${return_heart_minutes}
                save_as: send_heart_check
            else:
            - set: {send_heart_check: true}

        - if:
            value: ${send_heart_check}
            then:
            - run_flow: send_heart
            # Back down until the next mark. Safe to write after the call:
            # run_flow isolates send_heart's own variables and restores this
            # loop's copy on the way out, so this `set` lands on the copy the
            # gate reads next cycle.
            - set: {send_heart_check: false}
            else:
            # send_heart is what normally leaves the game on the home screen
            # (its last step taps home_button). Skipping it would leave the
            # mailbox open, so the next cycle's blind tap at [453, 224] lands
            # on whatever the mailbox has put there. Optional because the nav
            # rail is on screen either way -- a miss costs a scan, not a run.
            - if_found:
                template: home
                timeout: 5
                then:
                    # do nothing
                else:
                    - find_click:
                        template: home_button
                        timeout: 3

        # Play a round instead of idling between cycles. The tray sets
        # play_chance_percent to 0 while Auto Play is unticked, so the roll
        # never hits and every cycle takes the wait branch as before.
        - chance:
            percent: ${play_chance_percent}
            then:
            - run_flow:
                flow: play
                isolate: false
                vars:
                  stuck_check: "${stuck_check}"
            - if:
                value: ${level_cap_found}
                then:
                - run_flow: unlock_tsum_level_cap
                - set: {level_cap_found: false}
            else:
            - wait: {min: 30, max: 90}