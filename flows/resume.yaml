name: resume_send_heart
description: Send heart without restart LDPlayer

steps:
  
  # Everything below is the repeatable cycle: check mailbox, do the ranking /
  # heart-sending pass, go home, and loop back to the mailbox check again.
  # Runs until you stop it (F12) -- this is a live bot loop, not a one-shot.
  - repeat:
      forever: true
      steps:
        # Open the mailbox whichever state it is in. The badge changes the
        # icon enough that one template cannot cover both (plain mailbox.png
        # only scores ~0.80 against the badged icon, under the 0.85 threshold),
        # so look for the badged version first and fall back to the plain one.
        # `then` and `else` must line up with `template` -- indent them any
        # further left and YAML hands them to the step instead of to if_found,
        # which drops the branch without any error.
        - if_found:
            template: mailbox_with_red
            timeout: 5
            then:
              # Receiving all gift from mailbox
              - find_click: {template: mailbox_with_red, timeout: 3}
            else:
              - find_click: {template: mailbox, timeout: 5}

        - wait: 2

        # Shared with start.yaml -- edit flows/claim_mailbox.yaml.
        - run_flow: claim_mailbox

        - find_click:
            template: announcement_close_button
            timeout: 4

        - wait: {min: 0.4, max: 0.7}

        - run_flow: send_heart

        - wait: 3

        # play game
        - chance:
            percent: 8
            then:
            - run_flow: play

        - wait: {min: 75, max: 110}
