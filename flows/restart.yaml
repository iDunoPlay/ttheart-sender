name: restart
description: Restart the LDPlayer instance and re-attach to its new window

# Recovery flow: when the game is wedged and no template lookup will unstick
# it, throw the whole emulator away and start again.
#
# It stops at LDPlayer's home screen and does *not* relaunch the game --
# launch.yaml owns that, and calling it from here would leave the two flows
# calling each other with nothing bounding the depth. Run standalone, this
# leaves you with a freshly booted emulator sitting on its home screen.
#
# The one thing that makes this different from every other flow: LDPlayer's
# restart destroys its window and builds a fresh one with a *new* handle. The
# handle attached at startup dies the moment the Restart item is clicked, so
# every step from there down to `prepare_window: {redetect: true}` is blind --
# no template lookups, no window-relative clicks that matter. Opening the menu
# and finding Restart inside it happen while the window is still alive, which
# is why those two can use the screen and nothing after them can.

steps:
  # Park the window first so the menu click below lands where it was measured.
  # Coordinates are content-relative, and the content area only matches the
  # measurements while LDPlayer sits at window.position.
  - prepare_window

  - click: [517, 19]                  # LDPlayer title-bar menu (top right)
  - wait: {min: 0.4, max: 0.8}

  # Restart does not sit at a fixed height in that menu. LDPlayer sometimes
  # packs an ad banner into it, and everything below the banner shifts down --
  # so a measured coordinate lands on whichever item happens to be in that slot
  # instead, which is how a "restart" ends up doing something else entirely.
  # Find the item and click where it actually is.
  #
  # The measured position stays as the fallback, same arrangement as
  # dismiss_ldplayer_ad.yaml: at 88x20 of mostly flat background this is a
  # thin template, and a menu that has already been opened is worse to walk
  # away from than to guess at. [180, 535] is Restart with no banner above it.
  - if_found:
      template: ldplayer_restart
      timeout: 5
      then:
        - find_click:
            template: ldplayer_restart
            timeout: 2
      else:
        - log: ldplayer_restart not found -- clicking the measured position
        - click: [180, 535]

  # Give LDPlayer time to actually tear the old window down. Without this the
  # re-detect below can find the *dying* window, park that, and then everything
  # after it fails on a handle that disappears a second later.
  - wait: 8

  # Detect LDPlayer again from scratch: window.target in config.yaml matches it
  # by class name / title, and window.position parks it back at (0, 0). This is
  # the step that turns a new handle into a usable content rect -- from here on
  # templates and window coordinates mean something again.
  - prepare_window:
      redetect: true
      timeout: 180

  # Android is still booting behind that window; this is the real "is it back"
  # check, so give it room.
  - wait_for: {template: ldplayer_homescreen, timeout: 180}

  - wait: 5

  # LDPlayer opens an ad on boot often enough to be part of the routine.
  - run_flow:
      flow: dismiss_ldplayer_ad

  - wait: 3
